aid: lecturio
name: Lecturio
description: 'Lecturio is a medical and nursing education technology company headquartered in Leipzig,
  Germany (Lecturio GmbH), serving more than 500,000 learners and educators across 175+ countries. The
  platform combines video lectures, concept pages, spaced-repetition quizzes, and AI-tutored question
  banks covering 20+ preclinical and clinical subjects, with exam preparation for USMLE, NBME, COMLEX,
  MCAT, PANCE, NCLEX-RN, and international licensure exams such as the Saudi SNLE. Alongside the direct-to-student
  Lecturio Medical and Lecturio Nursing products, the company sells institutional platforms to medical
  schools, nursing schools, hospitals, and residency programs under the Healer (clinical reasoning),
  SimTutor (simulation authoring), and SIMTICS (procedural simulation) brands. Lecturio publishes no
  public developer API or developer portal; its public machine-readable surface consists of an RFC 9116
  security.txt, a self-managed vulnerability disclosure policy, and a Rank Math generated llms.txt.'
